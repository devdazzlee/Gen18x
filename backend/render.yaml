services:
  - type: web
    name: gen18x-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: EMAIL_TO
        value: info@gen18x.com
      - key: ALLOWED_ORIGINS
        value: https://gen18x.com,https://www.gen18x.com

